<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Burhan — Создаю сайты</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #000000;
      --card: #111111;
      --border: rgba(255, 255, 255, 0.1);
      --accent1: #ffffff;
      --accent2: #aaaaaa;
      --accent3: #666666;
      --text: #f0f0f0;
      --muted: #888888;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Animated background particles */
    .bg-orbs {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.15;
      animation: drift linear infinite;
    }

    .orb-1 {
      width: 400px; height: 400px;
      background: #ffffff;
      top: -100px; left: -100px;
      animation-duration: 20s;
      opacity: 0.04;
    }

    .orb-2 {
      width: 350px; height: 350px;
      background: #bbbbbb;
      bottom: -80px; right: -80px;
      animation-duration: 25s;
      animation-delay: -10s;
      opacity: 0.04;
    }

    .orb-3 {
      width: 250px; height: 250px;
      background: #888888;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation-duration: 18s;
      animation-delay: -5s;
      opacity: 0.04;
    }

    @keyframes drift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25%       { transform: translate(30px, -20px) scale(1.05); }
      50%       { transform: translate(-20px, 30px) scale(0.95); }
      75%       { transform: translate(20px, 20px) scale(1.03); }
    }

    /* Card */
    .card {
      position: relative;
      z-index: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 56px 48px 48px;
      max-width: 420px;
      width: calc(100% - 32px);
      text-align: center;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08),
        0 32px 80px rgba(0, 0, 0, 0.8),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      animation: cardIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(32px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Top accent line */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 60%;
      height: 1px;
      background: linear-gradient(90deg, transparent, #ffffff, #888888, transparent);
      border-radius: 1px;
    }

    /* Avatar */
    .avatar {
      width: 88px; height: 88px;
      border-radius: 50%;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #ffffff, #888888, #333333);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 800;
      color: #000;
      letter-spacing: -1px;
      position: relative;
      box-shadow: 0 0 0 3px var(--card), 0 0 0 4px rgba(255,255,255,0.25), 0 0 30px rgba(255,255,255,0.1);
      animation: pulseRing 3s ease-in-out infinite;
    }

    @keyframes pulseRing {
      0%, 100% { box-shadow: 0 0 0 3px var(--card), 0 0 0 4px rgba(255,255,255,0.25), 0 0 30px rgba(255,255,255,0.1); }
      50%       { box-shadow: 0 0 0 3px var(--card), 0 0 0 6px rgba(255,255,255,0.15), 0 0 50px rgba(255,255,255,0.08); }
    }

    /* Name */
    .name {
      font-size: clamp(2.2rem, 8vw, 3rem);
      font-weight: 900;
      letter-spacing: -1.5px;
      line-height: 1;
      background: linear-gradient(135deg, #ffffff 0%, #cccccc 50%, #888888 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 24px rgba(255, 255, 255, 0.4));
      margin-bottom: 10px;
      animation: glow 4s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from { filter: drop-shadow(0 0 16px rgba(255, 255, 255, 0.3)); }
      to   { filter: drop-shadow(0 0 32px rgba(255, 255, 255, 0.5)); }
    }

    /* Specialization */
    .spec {
      font-size: 0.95rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 32px;
      position: relative;
      display: inline-block;
    }

    .spec::before,
    .spec::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 24px;
      height: 1px;
      background: var(--muted);
      opacity: 0.4;
    }
    .spec::before { right: calc(100% + 8px); }
    .spec::after  { left:  calc(100% + 8px); }

    /* Divider */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
      margin: 0 0 28px;
    }

    /* Social links */
    .socials {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-bottom: 32px;
    }

    .social-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 52px; height: 52px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      color: var(--muted);
      text-decoration: none;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      overflow: hidden;
    }

    .social-link::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--hover-bg, var(--accent1));
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .social-link:hover {
      transform: translateY(-4px) scale(1.08);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 8px 24px var(--hover-shadow, rgba(255,255,255,0.15));
    }

    .social-link:hover::before { opacity: 1; }

    .social-link svg {
      position: relative;
      z-index: 1;
      width: 22px; height: 22px;
      fill: currentColor;
    }

    /* Telegram colors */
    .link-tg { --hover-bg: linear-gradient(135deg,#333333,#555555); --hover-shadow: rgba(255,255,255,0.15); }

    /* GitHub colors */
    .link-gh { --hover-bg: linear-gradient(135deg,#222222,#444444); --hover-shadow: rgba(255,255,255,0.1); }

    /* VK colors */
    .link-vk { --hover-bg: linear-gradient(135deg,#2a2a2a,#4a4a4a); --hover-shadow: rgba(255,255,255,0.12); }

    /* CTA Button */
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 32px;
      border-radius: 100px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-decoration: none;
      color: #000;
      background: linear-gradient(135deg, #ffffff, #aaaaaa);
      border: none;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.2s ease;
      box-shadow: 0 4px 20px rgba(255,255,255,0.2);
      animation: buttonPulse 3s ease-in-out infinite;
    }

    @keyframes buttonPulse {
      0%, 100% { box-shadow: 0 4px 20px rgba(255,255,255,0.15); }
      50%       { box-shadow: 0 4px 30px rgba(255,255,255,0.25); }
    }

    .cta::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #cccccc, #ffffff);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .cta:hover {
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 8px 32px rgba(255,255,255,0.25);
    }

    .cta:hover::before { opacity: 1; }

    .cta:active {
      transform: scale(0.98);
    }

    .cta span, .cta svg {
      position: relative;
      z-index: 1;
    }

    .cta svg {
      width: 18px; height: 18px;
      fill: currentColor;
      transition: transform 0.2s ease;
    }

    .cta:hover svg { transform: translateX(3px); }

    /* Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 24px;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      opacity: 0.6;
    }

    .badge-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 6px #22c55e;
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    /* Tooltip */
    .social-link[data-tip] {
      position: relative;
    }

    .social-link[data-tip]::after {
      content: attr(data-tip);
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%) translateY(4px);
      background: rgba(15,15,20,0.95);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.72rem;
      white-space: nowrap;
      padding: 4px 10px;
      border-radius: 8px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    .social-link[data-tip]:hover::after {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 480px) {
      .card {
        padding: 44px 28px 36px;
        border-radius: 22px;
      }
      .avatar {
        width: 76px; height: 76px;
        font-size: 30px;
      }
    }
  </style>
</head>
